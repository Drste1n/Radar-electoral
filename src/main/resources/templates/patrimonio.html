<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desglose de Patrimônio - Radar Eleitoral</title>
    <!-- Fuentes para máxima legibilidad -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --radar-navy: #042444;    
            --radar-green: #008c4a;   
            --radar-yellow: #ffc800;  
            --radar-light-blue: #007bb5;
            --app-bg: #f8f9fa;        
        }
        
        body {
            background-color: var(--app-bg);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .corner-top-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--radar-green) 0%, var(--radar-green) 22%, var(--radar-yellow) 22%, var(--radar-yellow) 28%, transparent 28%);
            z-index: 0;
        }

        .corner-bottom-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 500px;
            height: 500px;
            background: linear-gradient(-45deg, var(--radar-navy) 0%, var(--radar-navy) 20%, var(--radar-yellow) 20%, var(--radar-yellow) 28%, var(--radar-green) 28%, var(--radar-green) 35%, transparent 35%);
            z-index: 0;
        }
        
        .dinero-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Header flotante con logo imponente a la izquierda */
        .header-custom {
            padding: 2rem 3rem 1rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .logo-container {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .logo-img {
            height: 280px; 
            width: auto;
            margin-top: -15px;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        .btn-regresar {
            background-color: var(--radar-navy);
            color: white;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-regresar:hover {
            background-color: var(--radar-green);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 140, 74, 0.3);
        }

        /* Tarjeta de Total General más compacta, moderna y elegante */
        .total-card-compact {
            background: white;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(4, 36, 68, 0.06);
            border-left: 6px solid var(--radar-green);
        }

        /* Tarjetas de categorías en Grid horizontal */
        .category-card {
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.5s ease forwards;
        }
        .category-card:hover {
            border-color: var(--radar-green);
            box-shadow: 0 12px 25px rgba(0, 140, 74, 0.12) !important;
            transform: translateY(-4px);
        }
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            color: white;
            box-shadow: 0 6px 12px rgba(4, 36, 68, 0.1);
        }

        .chevron-icon {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-card[aria-expanded="true"] .chevron-icon {
            transform: rotate(180deg);
        }

        /* Sub-tarjetas de bienes individuales con colores uniformes y amigables */
        .item-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .item-card:hover {
            background-color: #ffffff;
            border-color: var(--radar-green);
            box-shadow: 0 4px 12px rgba(0, 140, 74, 0.08);
        }

        .etiqueta-precio {
            background-color: #ffffff;
            color: var(--radar-navy);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 1.05rem;
            border: 1px solid #cbd5e1;
            white-space: nowrap;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .etiqueta-precio:hover {
            background-color: var(--radar-navy);
            color: var(--radar-yellow) !important;
            border-color: var(--radar-navy);
            box-shadow: 0 4px 10px rgba(4, 36, 68, 0.2);
        }
        
        .subtotal-pill {
            background-color: #f1f5f9;
            color: var(--radar-navy);
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .footer-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: var(--radar-navy);
            letter-spacing: 5px;
            font-size: 1.1rem;
            text-transform: uppercase;
            text-align: center;
            margin-top: auto;
            padding: 4rem 0 3rem 0;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 992px) {
            .header-custom {
                flex-direction: column;
                padding: 2rem;
                text-align: center;
            }
            .logo-img {
                height: 210px;
                margin-top: 0;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="corner-top-left"></div>
    <div class="corner-bottom-right"></div>

    <!-- Header flotante unificado -->
    <header class="header-custom">
        <div class="logo-container">
            <a href="/">
                <img th:src="@{/images/logo.png}" alt="Radar Eleitoral" class="logo-img">
            </a>
        </div>
        
        <div>
            <a th:href="@{/candidatos/{id}(id=${candidato.sqCandidato})}" class="btn btn-regresar rounded-pill py-2 px-4 shadow-sm">
                <i class="bi bi-arrow-left me-2"></i> Voltar ao Perfil
            </a>
        </div>
    </header>

    <div class="container mt-4 mb-5" style="max-width: 1000px; position: relative; z-index: 5;">
        
        <!-- Tarjeta de Total General Compacta y Elegante -->
        <div class="total-card-compact p-4 p-md-5 mb-5 d-flex flex-column flex-md-row align-items-center justify-content-between">
            <div class="d-flex align-items-center mb-3 mb-md-0 text-center text-md-start">
                <div class="me-md-4 mb-3 mb-md-0">
                    <img th:if="${not #strings.isEmpty(candidato.fotoUrl)}" th:src="${candidato.fotoUrl}" class="rounded-circle shadow-sm" style="width: 85px; height: 85px; object-fit: cover; border: 3px solid var(--radar-green);" alt="Foto">
                    <div th:unless="${not #strings.isEmpty(candidato.fotoUrl)}" class="rounded-circle shadow-sm d-flex justify-content-center align-items-center bg-light" style="width: 85px; height: 85px; border: 3px solid var(--radar-green);">
                        <i class="bi bi-person text-secondary" style="font-size: 2.5rem;"></i>
                    </div>
                </div>
                <div>
                    <span class="text-uppercase fw-bold text-muted" style="font-size: 0.8rem; letter-spacing: 1.5px;">Patrimônio Declarado (TSE)</span>
                    <h2 class="fw-bold mb-0 text-dark" th:text="${candidato.nombreUrna}" style="font-family: 'Montserrat', sans-serif;">Nome do Candidato</h2>
                </div>
            </div>
            <div class="text-center text-md-end">
                <h1 id="total-patrimonio-general" class="display-5 mb-0 dinero-text" style="color: var(--radar-green);" th:text="${candidato.patrimonio}">R$ 0,00</h1>
            </div>
        </div>

        <div id="datos-ocultos" style="display: none;" th:text="${candidato.bienesDetalles}"></div>
        
        <!-- Contenedor del Grid Horizontal para las Categorías -->
        <div id="contenedor-categorias" class="row row-cols-1 row-cols-md-2 g-4">
            <div id="mensaje-vacio" class="col-12 text-center p-5 text-muted" style="display: none;">
                <i class="bi bi-inbox" style="font-size: 4rem; color: #cbd5e1;"></i>
                <p class="mt-4 fs-4 fw-medium text-secondary">Nenhum bem detalhado encontrado.</p>
            </div>
        </div>
    </div>

    <footer class="footer-text">
        INFORMAÇÃO QUE FORTALECE A DEMOCRACIA
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Formatear el total general del patrimonio con puntos y comas
            const elTotal = document.getElementById('total-patrimonio-general');
            if (elTotal) {
                let textoPat = elTotal.innerText;
                let numStr = textoPat.replace('R$', '').trim().replace(/\./g, '').replace(',', '.');
                let numVal = parseFloat(numStr);
                if (!isNaN(numVal)) {
                    elTotal.innerText = numVal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                }
            }

            const datosCrudos = document.getElementById('datos-ocultos').innerText;
            const contenedor = document.getElementById('contenedor-categorias');
            const lineas = datosCrudos.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            if (lineas.length === 0 || datosCrudos.includes("No hay información")) {
                document.getElementById('mensaje-vacio').style.display = "block";
                return;
            }

            // Colores uniformes y agradables
            const grupos = {
                'imoveis': { nombre: 'Imóveis', icono: 'bi-building', c1: '#042444', c2: '#0a3a6b', items: [], total: 0 },
                'veiculos': { nombre: 'Veículos', icono: 'bi-car-front', c1: '#008c4a', c2: '#006635', items: [], total: 0 },
                'empresas': { nombre: 'Participações', icono: 'bi-briefcase', c1: '#007bb5', c2: '#005f8c', items: [], total: 0 },
                'financeiro': { nombre: 'Ativos Financeiros', icono: 'bi-safe', c1: '#d4a500', c2: '#b38f00', items: [], total: 0 },
                'outros': { nombre: 'Outros Bens', icono: 'bi-gem', c1: '#475569', c2: '#334155', items: [], total: 0 }
            };

            function parseBRL(texto) {
                let numStr = texto.replace('R$', '').trim().replace(/\./g, '').replace(',', '.');
                let num = parseFloat(numStr);
                return isNaN(num) ? 0 : num;
            }

            function formatBRL(numero) {
                return numero.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }

            lineas.forEach(linea => {
                const textoMin = linea.toLowerCase();
                let cat = 'outros';

                if (textoMin.includes('casa') || textoMin.includes('apartamento') || textoMin.includes('terreno') || textoMin.includes('imóvel') || textoMin.includes('sala') || textoMin.includes('prédio')) cat = 'imoveis';
                else if (textoMin.includes('veículo') || textoMin.includes('automotor') || textoMin.includes('carro') || textoMin.includes('embarcação') || textoMin.includes('caminhão') || textoMin.includes('moto')) cat = 'veiculos';
                else if (textoMin.includes('quota') || textoMin.includes('ação') || textoMin.includes('ações') || textoMin.includes('capital') || textoMin.includes('empresa') || textoMin.includes('fundo')) cat = 'empresas';
                else if (textoMin.includes('depósito') || textoMin.includes('poupança') || textoMin.includes('dinheiro') || textoMin.includes('aplicação') || textoMin.includes('conta')) cat = 'financeiro';

                let nombreBien = linea;
                let valorTexto = "R$ 0,00";
                let valorNum = 0;
                
                if (linea.includes("R$")) {
                    const partes = linea.split("R$");
                    nombreBien = partes[0].replace(/[:\-]\s*$/, "").trim();
                    valorNum = parseBRL(partes[1].trim());
                    valorTexto = formatBRL(valorNum);
                }

                grupos[cat].items.push({ nombre: nombreBien, valor: valorTexto });
                grupos[cat].total += valorNum;
            });

            let delayIndex = 0;
            for (const [id, data] of Object.entries(grupos)) {
                if (data.items.length === 0) continue;

                const delayAnimacion = delayIndex * 0.1;
                delayIndex++;

                let itemsHtml = '';
                data.items.forEach(item => {
                    itemsHtml += `
                        <div class="item-card p-3 mb-2 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center">
                            <span class="text-dark fw-medium mb-2 mb-sm-0 pe-3" style="font-size: 1rem; line-height: 1.4;">${item.nombre}</span>
                            <span class="dinero-text etiqueta-precio">${item.valor}</span>
                        </div>
                    `;
                });

                const htmlCategoria = `
                    <div class="col">
                        <div class="category-card shadow-sm" style="animation-delay: ${delayAnimacion}s;" data-bs-toggle="collapse" data-bs-target="#colapso-${id}" aria-expanded="false">
                            
                            <div class="card-body p-4 d-flex align-items-center">
                                <div class="icon-wrapper" style="background: linear-gradient(135deg, ${data.c1}, ${data.c2});">
                                    <i class="bi ${data.icono}"></i>
                                </div>
                                <div class="flex-grow-1 ms-3">
                                    <h5 class="mb-1 fw-bold" style="color: var(--radar-navy);">${data.nombre}</h5>
                                    <span class="text-muted" style="font-size: 0.85rem;">${data.items.length} ${data.items.length === 1 ? 'registro' : 'registros'}</span>
                                </div>
                                <div class="text-end d-flex align-items-center">
                                    <div class="me-3 d-none d-sm-block">
                                        <div class="dinero-text subtotal-pill">${formatBRL(data.total)}</div>
                                    </div>
                                    <i class="bi bi-chevron-down chevron-icon fs-4 text-muted"></i>
                                </div>
                            </div>

                            <div id="colapso-${id}" class="collapse">
                                <div class="p-3 pt-0 bg-white" style="border-radius: 0 0 20px 20px;">
                                    <div style="height: 1px; background-color: #e2e8f0; margin-bottom: 1rem;"></div>
                                    ${itemsHtml}
                                </div>
                            </div>

                        </div>
                    </div>
                `;

                contenedor.innerHTML += htmlCategoria;
            }
        });
    </script>
</body>
</html>
